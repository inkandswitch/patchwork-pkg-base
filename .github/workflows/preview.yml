name: patchwork preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  SHELL_REPO: inkandswitch/patchwork.inkandswitch.com
  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
  ALIAS: patchwork-preview-${{ github.event.number }}
  MARKER: "<!-- patchwork-preview -->"

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    # A newer push makes this run's wait pointless; let it go.
    concurrency:
      group: patchwork-preview-${{ github.event.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PATCHWORK_CROW_TOKEN }}
          script: |
            const marker = process.env.MARKER
            const notice = `${marker}\n> [!NOTE]\n> _(caw caw rebuilding)_`
            const {owner, repo} = context.repo
            const issue_number = context.issue.number
            const comments = await github.rest.issues.listComments({owner, repo, issue_number})
            const existing = comments.data.find(c => c.body.startsWith(marker))
            if (existing) {
              const rest = existing.body
                .slice(marker.length)
                .replace(/^\s*> \[!NOTE\]\n> _\(caw caw rebuilding\)_/, "")
                .trimStart()
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id,
                body: `${notice}\n\n${rest}`,
              })
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body: notice})
            }

      - uses: actions/checkout@v4
        with:
          path: base

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SHELL_REPO }}
          path: shell

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: shell/pnpm-lock.yaml

      # Netlify builds this PR's tools bundle on its own, and that usually
      # finishes after this job starts. Wait for the deploy built from exactly
      # this head commit, then use its permalink (https://<deploy id>--<site>…),
      # which never moves. The `deploy-preview-N` alias moves with every push,
      # so it could still be serving the previous commit's packages.
      - name: wait for this commit's tools bundle
        id: bundle
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          api() { curl -sf -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "$@"; }
          site=$(api "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID" | jq -r .name)
          for attempt in $(seq 1 100); do
            deploy=$(api "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys?per_page=50" |
              jq -c --arg sha "$SHA" \
                '[.[] | select(.commit_ref == $sha and .context == "deploy-preview")] | first // empty') ||
              deploy=""  # a blip from the API: just ask again next time round
            state="not started"
            [ -n "$deploy" ] && state=$(echo "$deploy" | jq -r '.state')
            echo "attempt $attempt: tools bundle for ${SHA:0:7} is $state"
            if [ "$state" = "ready" ]; then
              id=$(echo "$deploy" | jq -r .id)
              echo "url=https://$id--$site.netlify.app/modules.json" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$state" = "error" ]; then
              echo "::error::Netlify's build of the tools bundle for ${SHA:0:7} failed: $(echo "$deploy" | jq -r '.error_message // "no message"')"
              exit 1
            fi
            sleep 15
          done
          echo "::error::gave up waiting 25 minutes for Netlify to build the tools bundle for ${SHA:0:7}"
          exit 1

      - run: pnpm install --frozen-lockfile

      - name: build shell against this PR's tools bundle
        env:
          PATCHWORK_SYSTEM_PACKAGE_LIST_URL: ${{ steps.bundle.outputs.url }}
        run: pnpm build

      # The shell's dist carries its own modules.json, copied from the published
      # patchwork-pkg-base. The shell doesn't load it (it uses the URL above),
      # but anyone checking /modules.json on the preview would see the published
      # packages, not this PR's. Replace it with this PR's list, every entry made
      # absolute so it points at this PR's packages and not the shell's copies.
      - name: make the preview's modules.json this PR's
        env:
          PACKAGE_LIST_URL: ${{ steps.bundle.outputs.url }}
        run: |
          set -euo pipefail
          base="${PACKAGE_LIST_URL%modules.json}"
          curl -sfL "$PACKAGE_LIST_URL" |
            jq --arg base "$base" \
              '.modules |= map(if test("^[a-z][a-z0-9+.-]*:") then . else $base + ltrimstr("./") end)' \
            > dist/modules.json
          jq . dist/modules.json

      - name: free the alias
        run: ../base/.github/scripts/netlify-purge-alias.sh

      - name: deploy
        id: deploy
        run: |
          set -o pipefail
          out=$(pnpm --package=netlify-cli dlx netlify deploy \
            --dir=dist \
            --no-build \
            --alias="$ALIAS" \
            --message="patchwork-base#${{ github.event.number }} @ ${{ github.event.pull_request.head.sha }}" \
            --json)
          echo "$out" | jq .
          echo "url=$(echo "$out" | jq -er .deploy_url)" >> "$GITHUB_OUTPUT"

      - name: verify the deploy serves this PR's tools bundle
        env:
          SHELL_URL: ${{ steps.deploy.outputs.url }}
          PACKAGE_LIST_URL: ${{ steps.bundle.outputs.url }}
        run: |
          set -o pipefail
          html=$(curl -sfL "$SHELL_URL")
          for asset in $(echo "$html" | grep -oE '/assets/[A-Za-z0-9_.-]+\.js' | sort -u); do
            if curl -sfL "$SHELL_URL$asset" | grep -qF "$PACKAGE_LIST_URL"; then
              echo "ok: $asset references $PACKAGE_LIST_URL"
              exit 0
            fi
          done
          echo "::error::deployed shell at $SHELL_URL does not reference $PACKAGE_LIST_URL"
          exit 1

      - uses: actions/github-script@v7
        env:
          SHELL_URL: ${{ steps.deploy.outputs.url }}
        with:
          github-token: ${{ secrets.PATCHWORK_CROW_TOKEN }}
          script: |
            const marker = process.env.MARKER
            const sha = context.payload.pull_request.head.sha.slice(0, 7)
            const body = [
              marker,
              `### ✅ Patchwork glance ready`,
              ``,
              `## ${process.env.SHELL_URL}`,
              ``,
              `Patchwork from \`${process.env.SHELL_REPO}\`, packages from this PR at \`${sha}\`.`,
              ``,
              `[build-info.json](${process.env.SHELL_URL}/build-info.json)`,
            ].join("\n")
            const {owner, repo} = context.repo
            const issue_number = context.issue.number
            const comments = await github.rest.issues.listComments({owner, repo, issue_number})
            const existing = comments.data.find(c => c.body.startsWith(marker))
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body})
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body})
            }

  teardown:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - run: .github/scripts/netlify-purge-alias.sh

      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PATCHWORK_CROW_TOKEN }}
          script: |
            const marker = process.env.MARKER
            const {owner, repo} = context.repo
            const issue_number = context.issue.number
            const comments = await github.rest.issues.listComments({owner, repo, issue_number})
            const existing = comments.data.find(c => c.body.startsWith(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id,
                body: `${marker}\n### 🪡 Patchwork preview\n\nTorn down.`,
              })
            }
