name: add to project

on:
  issues:
    types: [opened, reopened, transferred]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/inkandswitch/projects/2
          github-token: ${{ secrets.PATCHWORK_CROW_TOKEN }}
