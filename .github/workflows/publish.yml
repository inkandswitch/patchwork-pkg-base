name: publish

on:
  workflow_dispatch:
  push:
    branches: [main]

# One publish at a time: each run bumps from the registry's latest version, so
# two overlapping runs pick the same number and the second gets a 409.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            **/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - uses: actions/cache@v4
        with:
          path: |
            */node_modules
            tasks/src/in-the-cloud/node_modules
          key: ${{ runner.os }}-publish-node-modules-${{ hashFiles('**/package.json', '**/pnpm-lock.yaml', '**/pnpm-workspace.yaml') }}
          restore-keys: |
            ${{ runner.os }}-publish-node-modules-

      - run: npm install -g npm@latest

      - name: update preview.patchwork.inkandswitch.com
        env:
          GH_TOKEN: ${{ secrets.PATCHWORK_CROW_TOKEN }}
        run: |
          gh api --method POST \
            repos/inkandswitch/patchwork.inkandswitch.com/dispatches \
            -f event_type=base-main \
            -F "client_payload[sha]=$GITHUB_SHA"

      # installs and builds each tool in its own folder
      - run: pnpm build:ci --strict
        env:
          PATCHWORK_EXIT_IDLE_MS: 120000

      - run: npm install -g pushwork@^2.2.3

      # pushwork inits every package and writes static-dist/module-settings-url and static-dist/plugin-registry-url
      - run: pnpm modules-doc

      - name: prepare static-dist/package.json
        run: |
          node -e '
            const {execSync} = require("node:child_process")
            const fs = require("node:fs")
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"))
            delete pkg.private
            // we publish static-dist itself, so its contents are the package
            // root — the field pointing at static-dist is a checkout-only truth
            delete pkg.patchwork
            let latest = "0.0.0"
            try {
              latest = execSync(`npm view ${pkg.name} version`, {stdio: ["ignore", "pipe", "ignore"]}).toString().trim()
            } catch {}
            const [major, minor, patch] = latest.split(".").map(Number)
            pkg.version = `${major}.${minor}.${patch + 1}`
            fs.writeFileSync("static-dist/package.json", JSON.stringify(pkg, null, 2) + "\n")
            console.log(`publishing ${pkg.name}@${pkg.version} (latest was ${latest})`)
          '

      # A version npm has staged but not yet made live (it takes a few minutes)
      # doesn't show up in `npm view`, so the bump above can pick a number
      # that's already taken; npm answers that with a 409. Take the next one.
      - name: publish
        working-directory: static-dist
        run: |
          log="$RUNNER_TEMP/npm-publish.log"
          for attempt in 1 2 3 4 5; do
            if npm publish --access public 2>&1 | tee "$log"; then
              exit 0
            fi
            grep -q "E409" "$log" || exit 1
            next=$(node -e '
              const fs = require("node:fs")
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"))
              const [major, minor, patch] = pkg.version.split(".").map(Number)
              pkg.version = `${major}.${minor}.${patch + 1}`
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n")
              console.log(pkg.version)
            ')
            echo "version taken (409), retrying as $next"
          done
          exit 1

      - name: update patchwork.inkandswitch.com
        env:
          GH_TOKEN: ${{ secrets.PATCHWORK_CROW_TOKEN }}
        run: |
          gh api --method POST \
            repos/inkandswitch/patchwork.inkandswitch.com/dispatches \
            -f event_type=base-published
